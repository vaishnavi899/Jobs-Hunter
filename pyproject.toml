[project]
name = "jobhunter"
version = "0.1.0"
description = "Self-hosted personal job-application agent (manual intake, approval-gated submission)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "anthropic>=0.40",       # parse = Haiku, draft = Sonnet (checkpoints 3-4)
    "httpx>=0.27",           # resolve shortened links + fetch JD pages (checkpoint 3)
    "beautifulsoup4>=4.12",  # extract text from fetched JD pages (checkpoint 3)
    # Later-checkpoint dependencies:
    #   apscheduler (watch loop)      -> checkpoint 8
    #   playwright  (ATS adapters)    -> checkpoints 6-7
    #   google-api-python-client, google-auth-oauthlib (Gmail) -> checkpoint 5
    #   python-telegram-bot           -> checkpoint 8
]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunter"]

[tool.ruff]
line-length = 100
target-version = "py311"
