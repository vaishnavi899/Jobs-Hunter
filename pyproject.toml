[project]
name = "jobhunter"
version = "0.1.0"
description = "Self-hosted personal job-application agent (manual intake, approval-gated submission)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "anthropic>=0.40",       # parse = Haiku, draft = Sonnet (checkpoints 3-4)
    "httpx>=0.27",           # link resolve + JD fetch (cp3); Telegram Bot API (cp8)
    "beautifulsoup4>=4.12",  # extract text from fetched JD pages (checkpoint 3)
    "apscheduler>=3.10",     # the `watch` scheduler loop (checkpoint 8)
]

[project.optional-dependencies]
# ATS adapters (Greenhouse/Lever) drive a headless browser. Optional so the
# rest of the pipeline installs and runs with no browser. Enable with:
#   uv sync --extra ats   (then: playwright install chromium)
ats = ["playwright>=1.40"]
# Real Gmail sending (the gated `send --send --i-confirm` path). Optional.
gmail = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunter"]

[tool.ruff]
line-length = 100
target-version = "py311"
